<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NexJump — Game Lompat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1120;--panel:#0f172a;--line:#1e293b;--text:#e2e8f0;--mute:#94a3b8;--brand:#34d399;--warn:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Fredoka',system-ui,sans-serif;overflow:hidden;touch-action:none}
#app{display:flex;height:100%;gap:16px;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
#stage{position:relative;height:min(100dvh - 24px,760px);aspect-ratio:3/5;max-width:100%;border-radius:20px;overflow:hidden;border:2px solid var(--line);background:#0f172a}
canvas{width:100%;height:100%;display:block}
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;pointer-events:none;font-weight:700}
.hud b{font-size:26px;color:var(--brand)}
.hud span{font-size:13px;color:var(--mute)}
.overlay{position:absolute;inset:0;background:rgba(11,17,32,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.overlay.hidden{display:none}
.who{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:14px}
.who img{width:40px;height:40px;border-radius:12px;object-fit:cover}
h1{margin:0;font-size:34px}
p{margin:0;color:var(--mute);font-size:14px;line-height:1.5}
.big{font-size:44px;font-weight:700;color:var(--brand)}
button,a.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 22px;background:var(--brand);color:#052e22;cursor:pointer;text-decoration:none;font-size:16px}
button.alt,a.btn.alt{background:var(--line);color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#board{width:260px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;max-height:min(100dvh - 24px,760px);overflow:auto}
#board h2{margin:0 0 10px;font-size:18px}
#board ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#board li{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 8px;border-radius:10px;background:#0b1120}
#board li.me{outline:2px solid var(--brand)}
#board li img{width:26px;height:26px;border-radius:8px}
#board li .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#board li .s{color:var(--brand);font-weight:700}
#status{font-size:12px;color:var(--mute);margin-top:8px}
@media(max-width:820px){#board{display:none}#stage{height:100dvh;border-radius:0;border:0}#app{padding:0}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="360" height="600"></canvas>
    <div class="hud"><div><span>Skor</span><br><b id="score">0</b></div><div style="text-align:right"><span>Terbaik</span><br><b id="best" style="color:var(--warn)">0</b></div></div>

    <div id="ovLoading" class="overlay"><p>Memeriksa akun…</p></div>

    <div id="ovNoAuth" class="overlay hidden">
      <h1>Belum masuk</h1>
      <p id="noAuthMsg">Masuk dulu lewat chat dengan nomor 4-digit dan PIN, lalu tekan tombol gamepad.</p>
      <a class="btn" href="index.html">Ke halaman chat</a>
    </div>

    <div id="ovStart" class="overlay hidden">
      <h1>NexJump</h1>
      <div class="who"><img id="uAvatar" alt=""><div style="text-align:left"><div id="uName" style="font-weight:700"></div><p id="uNum"></p></div></div>
      <p>Geser kiri/kanan layar, atau tombol ← → / A D.<br>Lompat setinggi mungkin, jangan jatuh.</p>
      <div class="row"><button id="btnPlay">Main</button><a class="btn alt" href="index.html">Kembali ke chat</a></div>
    </div>

    <div id="ovOver" class="overlay hidden">
      <h1>Game over</h1>
      <div class="big" id="finalScore">0</div>
      <p id="saveMsg"></p>
      <div class="row"><button id="btnAgain">Main lagi</button><a class="btn alt" href="index.html">Kembali ke chat</a></div>
    </div>
  </div>

  <aside id="board"><h2>Papan skor</h2><ol id="boardList"></ol><div id="status"></div></aside>
</div>

<script>
/* ============ 1. SUPABASE ============ */
const SUPABASE_URL = 'https://zyddldgtefrtwjgymbtk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_hrVo6BmPk-4b8YQozWzn9g_4xJlLwa-';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let scoresReady = false;

/* ============ 2. AUTH DARI CHAT ============ */
let user = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show = id => ['ovLoading','ovNoAuth','ovStart','ovOver'].forEach(o => $(o).classList.toggle('hidden', o !== id));
const hideAll = () => show(null);

async function authenticate() {
  const params = new URLSearchParams(location.search);
  let session = null;
  try { session = JSON.parse(localStorage.getItem('nexchat_session_user') || 'null'); } catch (e) {}
  const phone = params.get('phone') || session?.phone_4;
  if (!phone || !session || session.phone_4 !== phone) return fail('Sesi chat tidak ditemukan. Masuk dulu lewat halaman chat.');

  // Verifikasi PIN ke tabel chat_users
  try {
    const { data, error } = await sb.from('chat_users').select('phone_4,pin,display_name,avatar_url').eq('phone_4', phone).maybeSingle();
    if (!error && data) {
      if (data.pin !== session.pin) return fail('PIN tidak cocok. Masuk ulang lewat halaman chat.');
      user = { phone_4: data.phone_4, display_name: data.display_name, avatar_url: data.avatar_url || session.avatar_url };
    } else {
      user = { phone_4: session.phone_4, display_name: session.display_name, avatar_url: session.avatar_url };
    }
  } catch (e) {
    user = { phone_4: session.phone_4, display_name: session.display_name, avatar_url: session.avatar_url };
  }
  // Bersihkan parameter dari URL
  history.replaceState(null, '', location.pathname);

  $('uAvatar').src = user.avatar_url || '';
  $('uName').textContent = user.display_name;
  $('uNum').textContent = '#' + user.phone_4;

  await checkScoresTable();
  const mine = await fetchMyBest();
  best = Math.max(mine, +localStorage.getItem('nexjump_best_' + user.phone_4) || 0);
  $('best').textContent = best;
  loadBoard();
  show('ovStart');
}
function fail(msg) { $('noAuthMsg').textContent = msg; show('ovNoAuth'); }

/* ============ 3. SKOR KE SUPABASE ============ */
async function checkScoresTable() {
  try { const { error } = await sb.from('game_scores').select('phone_4').limit(1); scoresReady = !error; }
  catch (e) { scoresReady = false; }
  $('status').textContent = scoresReady ? 'Tersambung ke Supabase' : 'Tabel game_scores belum ada — skor hanya tersimpan di perangkat ini.';
}
async function fetchMyBest() {
  if (!scoresReady) return 0;
  const { data } = await sb.from('game_scores').select('best_score').eq('phone_4', user.phone_4).maybeSingle();
  return data?.best_score || 0;
}
async function saveScore(score) {
  const key = 'nexjump_best_' + user.phone_4;
  if (score > (+localStorage.getItem(key) || 0)) localStorage.setItem(key, score);
  if (!scoresReady) return 'Skor disimpan di perangkat ini saja.';
  const { data: row } = await sb.from('game_scores').select('best_score,total_games').eq('phone_4', user.phone_4).maybeSingle();
  const prevBest = row?.best_score || 0;
  const { error } = await sb.from('game_scores').upsert({
    phone_4: user.phone_4,
    display_name: user.display_name,
    avatar_url: user.avatar_url,
    best_score: Math.max(prevBest, score),
    total_games: (row?.total_games || 0) + 1,
    updated_at: new Date().toISOString()
  }, { onConflict: 'phone_4' });
  if (error) return 'Gagal menyimpan ke Supabase: ' + error.message;
  loadBoard();
  return score > prevBest ? 'Rekor baru tersimpan ke akunmu!' : 'Skor terbaikmu tetap ' + prevBest + '.';
}
async function loadBoard() {
  const ol = $('boardList');
  if (!scoresReady) { ol.innerHTML = '<p>Belum tersambung.</p>'; return; }
  const { data } = await sb.from('game_scores').select('phone_4,display_name,avatar_url,best_score').order('best_score', { ascending: false }).limit(10);
  ol.innerHTML = (data || []).map((r, i) => `
    <li class="${r.phone_4 === user.phone_4 ? 'me' : ''}">
      <span>${i + 1}</span><img src="${esc(r.avatar_url)}" alt=""><span class="n">${esc(r.display_name)}</span><span class="s">${r.best_score}</span>
    </li>`).join('') || '<p>Belum ada skor. Jadilah yang pertama.</p>';
}
// Realtime: papan skor ikut berubah saat ada yang memecahkan rekor
sb.channel('scores_live').on('postgres_changes', { event: '*', schema: 'public', table: 'game_scores' }, () => { if (scoresReady) loadBoard(); }).subscribe();

/* ============ 4. GAME ============ */
const cv = $('cv'), ctx = cv.getContext('2d');
const W = 360, H = 600, G = 0.42, JUMP = -11.2, PW = 62, PH = 12, PLW = 34, PLH = 34;
let p, plats, score, best = 0, running = false, over = false, maxY, dir = 0, targetX = null;
const keys = {};

function reset() {
  p = { x: W / 2 - PLW / 2, y: H - 120, vy: JUMP, face: 1 };
  plats = []; score = 0; maxY = p.y;
  plats.push({ x: W / 2 - PW / 2, y: H - 60, t: 'n' });
  let y = H - 60;
  while (y > -H) { y -= 60 + Math.random() * 20; plats.push(mk(y)); }
  $('score').textContent = 0;
}
function mk(y) {
  const r = Math.random();
  let t = 'n';
  if (score > 250 && r < .2) t = 'm';
  else if (score > 500 && r < .35) t = 'b';
  return { x: Math.random() * (W - PW), y, t, vx: t === 'm' ? (Math.random() < .5 ? 1.4 : -1.4) : 0, dead: false };
}
function start() { reset(); running = true; over = false; hideAll(); }

function update() {
  if (!running) return;
  // gerak horizontal
  let mv = 0;
  if (keys.ArrowLeft || keys.a || dir < 0) mv = -5.2;
  if (keys.ArrowRight || keys.d || dir > 0) mv = 5.2;
  if (targetX !== null) { const dx = targetX - (p.x + PLW / 2); mv = Math.abs(dx) < 4 ? 0 : Math.sign(dx) * Math.min(6, Math.abs(dx) * .25); }
  p.x += mv; if (mv) p.face = Math.sign(mv);
  if (p.x > W) p.x = -PLW; if (p.x < -PLW) p.x = W;
  p.vy += G; p.y += p.vy;

  // platform
  plats.forEach(pl => { if (pl.t === 'm') { pl.x += pl.vx; if (pl.x < 0 || pl.x > W - PW) pl.vx *= -1; } });
  if (p.vy > 0) for (const pl of plats) {
    if (pl.dead) continue;
    if (p.x + PLW > pl.x + 6 && p.x < pl.x + PW - 6 && p.y + PLH >= pl.y && p.y + PLH <= pl.y + PH + p.vy + 2) {
      if (pl.t === 'b') { pl.dead = true; continue; }
      p.vy = JUMP; break;
    }
  }
  // kamera
  if (p.y < H * .4) {
    const d = H * .4 - p.y; p.y = H * .4;
    plats.forEach(pl => pl.y += d);
    score += Math.round(d); $('score').textContent = Math.floor(score / 10);
  }
  plats = plats.filter(pl => pl.y < H + 20 && !(pl.dead && pl.y > H));
  let top = Math.min(...plats.map(pl => pl.y));
  const gap = Math.min(110, 62 + score / 80);
  while (top > -40) { top -= gap * (.75 + Math.random() * .25); plats.push(mk(top)); }
  if (p.y > H) gameOver();
}

async function gameOver() {
  running = false; over = true;
  const s = Math.floor(score / 10);
  $('finalScore').textContent = s;
  $('saveMsg').textContent = 'Menyimpan skor…';
  show('ovOver');
  if (s > best) { best = s; $('best').textContent = best; }
  $('saveMsg').textContent = await saveScore(s);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0b1120'); g.addColorStop(1, '#13263a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (!p) return;
  plats.forEach(pl => {
    if (pl.dead) { ctx.globalAlpha = .3; }
    ctx.fillStyle = pl.t === 'm' ? '#38bdf8' : pl.t === 'b' ? '#a16207' : '#34d399';
    ctx.beginPath(); ctx.roundRect(pl.x, pl.y, PW, PH, 6); ctx.fill();
    ctx.globalAlpha = 1;
  });
  // pemain (robot kecil)
  ctx.save(); ctx.translate(p.x + PLW / 2, p.y + PLH / 2);
  const sq = p.vy < 0 ? 1.08 : .95; ctx.scale(1 / sq, sq);
  ctx.fillStyle = '#6ee7b7'; ctx.beginPath(); ctx.roundRect(-PLW / 2, -PLH / 2, PLW, PLH, 10); ctx.fill();
  ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.roundRect(-13, -9, 26, 18, 6); ctx.fill();
  ctx.fillStyle = '#34d399';
  ctx.beginPath(); ctx.arc(-5 + p.face * 2, -2, 3, 0, 7); ctx.arc(7 + p.face * 2, -2, 3, 0, 7); ctx.fill();
  ctx.fillStyle = '#6ee7b7'; ctx.fillRect(-2, -PLH / 2 - 7, 4, 7);
  ctx.restore();
}
function loop() { update(); draw(); requestAnimationFrame(loop); }

/* ============ 5. INPUT (DESKTOP + MOBILE) ============ */
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys[k] = true; targetX = null;
  if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  if ((e.key === ' ' || e.key === 'Enter') && user) {
    if (!$('ovStart').classList.contains('hidden') || over) start();
  }
});
addEventListener('keyup', e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });

const stage = $('stage');
function px(e) { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; }
stage.addEventListener('pointerdown', e => { if (e.target.closest('button,a')) return; targetX = px(e); });
stage.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') targetX = px(e); });
addEventListener('pointerup', () => { targetX = null; });
addEventListener('pointercancel', () => { targetX = null; });
// Miring HP (opsional, aktif otomatis di perangkat yang mendukung)
addEventListener('deviceorientation', e => {
  if (!running || targetX !== null || e.gamma == null) return;
  dir = e.gamma > 8 ? 1 : e.gamma < -8 ? -1 : 0;
});

$('btnPlay').onclick = start;
$('btnAgain').onclick = start;

reset(); loop(); authenticate();
</script>
</body>
</html>
