const PL = [

  barnCap: 25,

};

let U = null, ready = false, LS = '', started = false, saveT = null;
let curSeasonIdx = 0, seasonTimer = Date.now(), activeDisaster = null; // { id, n, icon, until, desc }
let weatherDrops = [];

const level = () => 1 + Math.floor(Math.sqrt(S.exp / 40));
const skillLv = k => 1 + Math.floor(Math.sqrt((S.skills?.[k] || 0) / 30));
const hasTech = id => (S.techs || []).includes(id);
const hasFurn = id => (S.furniture || []).includes(id);
const vehObj = () => VEHICLES.find(v => v.id === S.curVehicle) || VEHICLES[0];

// Perhitungan Bonus Total (Rumah + Furnitur + Kendaraan + Skill Farming + Teknologi)
function bonus() {
  let b = (HOUSES[S.house] || HOUSES[0]).b;
  FURNITURES.forEach(f => { if (hasFurn(f.id)) b += f.b; });
  b += vehObj().harvBonus;
  b += (skillLv('farming') - 1) * 0.05;
  if (hasTech('greenhouse')) b += 0.20;
  if (hasTech('bibit_gmo')) b += 0.30;
  return b;
}

// Perhitungan Waktu Tumbuh (Dipengaruhi Musim, Bencana, Irigasi, Drone, Skill)
function growMs() {
  let base = Math.min(3.5, 1 + 0.15 * (level() - 1)) * BASE_MIN * 60000;
  const season = SEASONS[curSeasonIdx];
  let speed = season.growMod;
  if (season.id === 'kemarau' && hasTech('irigasi')) speed = 1.15;
  if (season.id === 'dingin' && hasTech('greenhouse')) speed = 1.10;
  if (hasTech('drone')) speed *= 1.25;
  speed *= (1 + (skillLv('farming') - 1) * 0.04);
  if (activeDisaster && activeDisaster.id === 'kekeringan' && !hasTech('irigasi')) speed *= 0.65;
  return Math.max(15000, Math.round(base / speed));
}

const fmt = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

function normalizeState(pick) {
  if (!pick) return;
  const up = Math.max(6, Math.min(12, pick.unlockedPlots || (pick.plots ? pick.plots.length : 6)));
  S = {
    coins: pick.coins || 0,
    exp: pick.exp || 0,
    house: Math.min(HOUSES.length - 1, pick.house || 0),
    unlockedPlots: up,
    plots: Array.from({ length: 12 }, (_, i) => pick.plots?.[i] || null),

    inv: { padi: 0, jagung: 0, tebu: 0, gandum: 0, telur: 0, susu: 0, keju: 0, daging: 0, kayu: 0, batu: 0, besi: 0, ...(pick.inv || {}) },

async function boot() {
  const ps = new URLSearchParams(location.search); let s = null;
  try { s = JSON.parse(localStorage.getItem('nexchat_session_user') || 'null'); } catch (e) {}
  const ph = ps.get('phone') || s?.phone_4;
  if (!ph || !s || s.phone_4 !== ph) return bad('Sesi chat tidak ditemukan. Masuk dulu lewat halaman chat.');
  U = { phone_4: s.phone_4, display_name: s.display_name, avatar_url: s.avatar_url };
  try {
    const { data, error } = await sb.from('chat_users').select('phone_4,pin,display_name,avatar_url').eq('phone_4', ph).maybeSingle();
    if (!error && data) {
      if (data.pin !== s.pin) return bad('PIN tidak cocok. Masuk ulang lewat halaman chat.');
      U = { phone_4: data.phone_4, display_name: data.display_name, avatar_url: data.avatar_url || s.avatar_url };
    }
  } catch (e) {}
  history.replaceState(null, '', location.pathname);
  LS = 'nexgrow_' + U.phone_4;
  let local = null, remote = null;
  try { local = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) {}
  try {
    const { error } = await sb.from('game_scores').select('phone_4,game,data').limit(1); ready = !error;
    if (ready) { const { data } = await sb.from('game_scores').select('data').eq('phone_4', U.phone_4).eq('game', 'grow').maybeSingle(); remote = data?.data; }
  } catch (e) {}
  const pick = [remote, local].filter(Boolean).sort((a, b) => (b.exp || 0) - (a.exp || 0))[0];
  normalizeState(pick);
  started = true; closePanel(); hud();
  if (!ready) toast('Supabase belum siap — progres hanya di perangkat ini');
}

function save() {
  if (!LS) return;
  localStorage.setItem(LS, JSON.stringify(S));
  if (!ready) return;
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    const { error } = await sb.from('game_scores').upsert({
      phone_4: U.phone_4, game: 'grow', display_name: U.display_name, avatar_url: U.avatar_url,
      best_score: S.exp, data: S, updated_at: new Date().toISOString()
    }, { onConflict: 'phone_4,game' });
    if (error) toast('Gagal simpan: ' + error.message);
  }, 700);
}
setInterval(() => { if (started) save(); }, 30000);

/* ============ SISTEM MUSIM & BENCANA ALAM ============ */
function updateSeasonAndDisaster() {
  const now = Date.now();
  // Ganti musim setiap 90 detik
  if (now - seasonTimer > 90000) {
    seasonTimer = now;
    curSeasonIdx = (curSeasonIdx + 1) % SEASONS.length;
    const sn = SEASONS[curSeasonIdx];
    toast(`${sn.icon} Pergantian Musim: ${sn.n}!`);
    hud();
    // Peluang bencana saat pergantian musim (30%)
    if (Math.random() < 0.30 && !activeDisaster) triggerDisaster();
  }
  if (activeDisaster && now > activeDisaster.until) {
    toast(`✅ Bencana ${activeDisaster.n} telah berakhir!`);
    activeDisaster = null;
    hud();
  }
}

function triggerDisaster() {
  if (hasTech('drone') && Math.random() < 0.75) {
    toast('🛸 Drone Cuaca berhasil menangkal bencana alam!');
    return;
  }
  const types = [
    { id: 'banjir',     n: 'Banjir Bandang', icon: '🌊', desc: 'Genangan air merusak petak tanpa pagar keamanan!' },
    { id: 'kekeringan', n: 'Kekeringan Ekstrem', icon: '🔥', desc: 'Tanaman tumbuh lebih lambat tanpa Irigasi!' },
    { id: 'badai',      n: 'Badai Petir',    icon: '⛈️', desc: 'Angin kencang mengancam ternak & hasil kebun!' }
  ];
  const d = types[Math.floor(Math.random() * types.length)];
  activeDisaster = { ...d, until: Date.now() + 35000 };

  const prot = (SECURITY[S.security] || SECURITY[0]).prot;
  if (Math.random() < prot) {
    toast(`🛡️ ${SECURITY[S.security].n} melindungi kebunmu dari ${d.n}!`);
  } else {
    // Efek kerusakan ringan jika keamanan rendah
    if (d.id === 'banjir' || d.id === 'badai') {
      const plantedIdx = S.plots.map((p, idx) => p ? idx : -1).filter(idx => idx >= 0);
      if (plantedIdx.length > 0 && Math.random() < (0.6 - prot * 0.5)) {
        const lost = plantedIdx[Math.floor(Math.random() * plantedIdx.length)];
        S.plots[lost] = null;
        toast(`${d.icon} ${d.n}! 1 petak tanaman hanyut (Tingkatkan Pagar Keamanan!).`);
        save();
      } else {
        toast(`${d.icon} Peringatan ${d.n}! Untung tanamanmu selamat.`);
      }
    } else {
      toast(`${d.icon} ${d.n} melanda! Waktu tumbuh melambat sementara.`);
    }
  }
  hud();
}
setInterval(() => { if (started) updateSeasonAndDisaster(); }, 2000);

/* ============ STICKMAN, PARTIKEL & INTERAKSI PETA ============ */
let P = { x: 200, y: 195, dir: 1, walkCycle: 0, moving: false, anim: null };
let floats = [], particles = [], smokes = [], keys = {}, jv = { x: 0, y: 0 };

function spawnParticles(x, y, color, count = 12, type = 'dirt') {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 2.8;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - (type === 'harvest' ? 2.2 : 1.2),
      c: color,
      sz: type === 'harvest' ? 3 + Math.random() * 3 : 2 + Math.random() * 2.5,
      life: 28 + Math.floor(Math.random() * 18),
      maxLife: 45,
      type
    });
  }
}

function near() {
  let b = null, bd = 52;
  PL.forEach((q, i) => {
    const d = Math.hypot(P.x - (q.x + 32), P.y - (q.y + 32));
    if (d < bd) { bd = d; b = { t: 'p', i }; }
  });
  Object.entries(ZONES).forEach(([k, z]) => {
    const d = Math.hypot(P.x - z.x, P.y - z.y);
    if (d < bd + 6) { bd = d; b = { t: k, label: z.label }; }
  });
  return b;
}

function act() {
  if (!started || !$('panel').classList.contains('hidden') || P.anim) return;
  const n = near(); if (!n) return;
  if (n.t === 'house')  return openHouse();
  if (n.t === 'barn')   return openBarn();
  if (n.t === 'ranch')  return openRanch();
  if (n.t === 'garage') return openGarage();
  if (n.t === 'hunt')   return openHunt();
  if (n.t === 'p') {
    if (n.i >= S.unlockedPlots) return openLandShop(n.i);
    const q = S.plots[n.i];
    if (!q) return openCrops(n.i);
    if (Date.now() >= q.e) startHarvestAnim(n.i);
  }
}

/* ============ PERTANIAN & GUDANG ============ */
function openCrops(i) {
  const sn = SEASONS[curSeasonIdx];
  setPanel(`<h2>🌱 Tanam di Petak #${i + 1}</h2><p>${sn.icon} <b>${sn.n}</b> · Waktu tumbuh: <b>${fmt(growMs())}</b><br>Bonus Total: <b>+${Math.round((bonus() - 1) * 100)}%</b> (Farming Lv.${skillLv('farming')})</p>` +
    Object.entries(CROPS).map(([k, c]) => {
      const lock = level() < c.lv;
      return `<button class="opt" ${lock ? 'disabled' : ''} onclick="plant(${i},'${k}')"><b><span>${c.icon} ${c.n}</span><span>+${c.xp} EXP</span></b><span>${lock ? '🔒 Butuh Level ' + c.lv : 'Nilai Jual Gudang: ~' + Math.round(c.v * bonus()) + ' koin'}</span></button>`;
    }).join(''));
}

function plant(i, k) {
  if (i >= S.unlockedPlots || S.plots[i] || level() < CROPS[k].lv || P.anim) return;
  closePanel();
  const px = PL[i].x + 32;
  P.dir = px >= P.x ? 1 : -1;
  P.anim = { type: 'plant', start: performance.now(), dur: 900, plotIdx: i, cropKey: k, fxDone: false };
}

function finalizePlant(i, k) {
  const now = Date.now();
  S.plots[i] = { c: k, s: now, e: now + growMs() };
  S.skills.farming = (S.skills.farming || 0) + 5;
  spawnParticles(PL[i].x + 32, PL[i].y + 38, '#78350f', 14, 'dirt');
  spawnParticles(PL[i].x + 32, PL[i].y + 32, '#fde047', 8, 'seed');
  save(); hud();
}

function startHarvestAnim(i) {
  const q = S.plots[i];
  if (!q || Date.now() < q.e || P.anim) return;
  const px = PL[i].x + 32;
  P.dir = px >= P.x ? 1 : -1;
  P.anim = { type: 'harvest', start: performance.now(), dur: 820, plotIdx: i, fxDone: false };
}

function harvest(i) {
  const q = S.plots[i]; if (!q) return;
  const c = CROPS[q.c], gain = Math.round(c.v * bonus()), old = level();
  const xpGain = Math.round(c.xp * (hasFurn('sofa') ? 1.1 : 1));
  S.exp += xpGain;
  S.skills.farming = (S.skills.farming || 0) + 12;
  S.plots[i] = null;

  // Masuk Gudang jika masih muat, jika penuh langsung terjual otomatis
  if (totalInv() < S.barnCap) {
    S.inv[q.c] = (S.inv[q.c] || 0) + 1;
    // Langsung beri koin dasar + simpan hasil di gudang untuk dimasak/dijual ekstra
    S.coins += gain;
    floats.push({ x: PL[i].x + 32, y: PL[i].y, t: 75, s: `+${gain}🪙 & +1 ${c.icon}` });
  } else {
    S.coins += gain;
    floats.push({ x: PL[i].x + 32, y: PL[i].y, t: 75, s: `+${gain}🪙 (Gudang Penuh)` });
  }

  spawnParticles(PL[i].x + 32, PL[i].y + 32, c.c, 18, 'harvest');
  if (level() > old) toast('🎉 Naik ke Level ' + level() + '! Fitur & tanaman baru terbuka.');
  save(); hud();
}

/* ============ GUDANG (BARN) ============ */
function openBarn() {
  const used = totalInv();
  const upCost = S.barnCap * 18;
  const itemMeta = {
    padi:   { n: 'Padi Emas', icon: '🌾', v: 15 },
    jagung: { n: 'Jagung Manis', icon: '🌽', v: 35 },
    tebu:   { n: 'Tebu Manis', icon: '🎋', v: 75 },
    gandum: { n: 'Gandum Unggul', icon: '🍞', v: 120 },
    telur:  { n: 'Telur Segar', icon: '🥚', v: 30 },
    susu:   { n: 'Susu Murni', icon: '🥛', v: 70 },
    keju:   { n: 'Keju & Daging Sapi', icon: '🧀', v: 160 },
    daging: { n: 'Daging Buruan', icon: '🍖', v: 65 },
    kayu:   { n: 'Kayu Hutan', icon: '🪵', v: 25 },
    batu:   { n: 'Batu Tambang', icon: '🪨', v: 40 },
    besi:   { n: 'Bijih Besi', icon: '⛏️', v: 90 }
  };

  let listHtml = Object.entries(itemMeta).map(([k, m]) => {
    const qty = S.inv[k] || 0;
    if (!qty) return '';
    const sellPrice = Math.round(m.v * qty * bonus());
    return `<div class="row">
      <span>${m.icon}</span>
      <span class="n"><b>${m.n}</b> (x${qty})</span>
      <button class="mini warn" onclick="sellItem('${k}')">Jual +${sellPrice}🪙</button>
    </div>`;
  }).join('');

  if (!listHtml) listHtml = '<p style="text-align:center;padding:10px 0">Gudang masih kosong. Panen kebun, ternak, atau berburu dulu!</p>';

  setPanel(`<h2>📦 Gudang Penyimpanan</h2>
    <p>Kapasitas Gudang: <b>${used} / ${S.barnCap} item</b>. Simpan bahan untuk dimasak di Dapur atau jual langsung dengan bonus <b>+${Math.round((bonus()-1)*100)}%</b>!</p>
    ${listHtml}
    <div style="display:flex;gap:6px;margin-top:4px">
      <button class="opt" style="flex:1" ${used === 0 ? 'disabled' : ''} onclick="sellAllBarn()"><b>💰 Jual Semua Isi Gudang</b><span>Cairkan seluruh stok bahan menjadi koin</span></button>
    </div>
    <button class="opt" ${S.coins < upCost ? 'disabled' : ''} onclick="upgradeBarn()">
      <b>⬆️ Perbesar Gudang (+15 Slot)</b>
      <span>Biaya: ${upCost} koin (Kapasitas jadi ${S.barnCap + 15})</span>
    </button>`);
}

function sellItem(k) {
  const prices = { padi: 15, jagung: 35, tebu: 75, gandum: 120, telur: 30, susu: 70, keju: 160, daging: 65, kayu: 25, batu: 40, besi: 90 };
  const qty = S.inv[k] || 0;
  if (!qty) return;
  const gain = Math.round((prices[k] || 20) * qty * bonus());
  S.coins += gain;
  S.inv[k] = 0;
  save(); hud(); openBarn();
  toast(`💰 Terjual seharga +${gain} koin!`);
}

function sellAllBarn() {
  const prices = { padi: 15, jagung: 35, tebu: 75, gandum: 120, telur: 30, susu: 70, keju: 160, daging: 65, kayu: 25, batu: 40, besi: 90 };
  let total = 0;
  Object.keys(S.inv).forEach(k => {
    const q = S.inv[k] || 0;
    if (q > 0) {
      total += Math.round((prices[k] || 20) * q * bonus());
      S.inv[k] = 0;
    }
  });
  if (!total) return;
  S.coins += total;
  save(); hud(); openBarn();
  toast(`🎉 Semua isi gudang terjual +${total} koin!`);
}

function upgradeBarn() {
  const upCost = S.barnCap * 18;
  if (S.coins < upCost) return;
  S.coins -= upCost;
  S.barnCap += 15;
  save(); hud(); openBarn();
  toast(`📦 Kapasitas Gudang naik menjadi ${S.barnCap}!`);
}

/* ============ PETERNAKAN (RANCH) ============ */
function openRanch() {
  const maxAnimals = S.ranchLv * 3;
  const now = Date.now();
  const ranchUpCost = S.ranchLv * 900;

  let ownedHtml = S.animals.map((a, idx) => {
    const meta = ANIMALS[a.type];
    const ready = now >= a.readyAt;
    return `<div class="row">
      <span style="font-size:18px">${meta.icon}</span>
      <span class="n"><b>${meta.n}</b><br><small style="color:var(--mute)">${ready ? '✨ Siap diambil!' : 'Produksi: ' + fmt(a.readyAt - now)}</small></span>
      <button class="mini ${ready ? 'warn' : ''}" ${!ready ? 'disabled' : ''} onclick="collectAnimal(${idx})">${ready ? 'Ambil ' + meta.prodName : 'Tunggu'}</button>
    </div>`;
  }).join('');

  if (!ownedHtml) ownedHtml = '<p>Belum ada hewan ternak. Beli di bawah untuk menghasilkan Telur, Susu & Daging!</p>';

  let shopHtml = Object.entries(ANIMALS).map(([k, a]) => {
    const full = S.animals.length >= maxAnimals;
    const can = S.coins >= a.p && !full;
    return `<button class="opt" ${!can ? 'disabled' : ''} onclick="buyAnimal('${k}')">
      <b><span>${a.icon} Beli ${a.n}</span><span>🪙 ${a.p}</span></b>
      <span>Hasil: ${a.prodName} (+${a.v} koin & stok dapur setiap ${Math.round(a.ms/1000)} dtk)</span>
    </button>`;
  }).join('');

  setPanel(`<h2>🐄 Peternakan (Lv.${S.ranchLv})</h2>
    <p>Ternak dimiliki: <b>${S.animals.length} / ${maxAnimals} ekor</b>. Keamanan Kandang: <b>${SECURITY[S.security].n}</b></p>
    ${ownedHtml}
    <h3>Beli Hewan Ternak Baru</h3>
    ${shopHtml}
    <button class="opt" ${S.coins < ranchUpCost || S.ranchLv >= 4 ? 'disabled' : ''} onclick="upgradeRanch()">
      <b>🏚️ Perluas Kandang Ternak (Lv.${S.ranchLv + 1})</b>
      <span>${S.ranchLv >= 4 ? '✓ Level Maksimal (12 Ekor)' : 'Biaya: ' + ranchUpCost + ' koin (+3 kapasitas ternak)'}</span>
    </button>`);
}

function buyAnimal(type) {
  const meta = ANIMALS[type];
  const maxAnimals = S.ranchLv * 3;
  if (!meta || S.animals.length >= maxAnimals || S.coins < meta.p) return;
  S.coins -= meta.p;
  S.animals.push({ type, readyAt: Date.now() + meta.ms });
  spawnParticles(ZONES.ranch.x, ZONES.ranch.y, '#fbbf24', 15, 'harvest');
  save(); hud(); openRanch();
  toast(`${meta.icon} ${meta.n} berhasil dibeli!`);
}

function collectAnimal(idx) {
  const a = S.animals[idx];
  if (!a || Date.now() < a.readyAt) return;
  const meta = ANIMALS[a.type];
  const gain = Math.round(meta.v * bonus());
  S.coins += gain;
  S.exp += meta.xp;
  S.skills.farming = (S.skills.farming || 0) + 10;
  if (totalInv() < S.barnCap) S.inv[meta.prod] = (S.inv[meta.prod] || 0) + 1;
  a.readyAt = Date.now() + meta.ms;
  save(); hud(); openRanch();
  toast(`${meta.icon} Panen ${meta.prodName}: +${gain} koin & masuk Gudang!`);
}

function upgradeRanch() {
  const cost = S.ranchLv * 900;
  if (S.ranchLv >= 4 || S.coins < cost) return;
  S.coins -= cost;
  S.ranchLv++;
  save(); hud(); openRanch();
  toast(`🐄 Kandang diperluas ke Level ${S.ranchLv}!`);
}

/* ============ GARASI KENDARAAN & MOBIL ============ */
function openGarage() {
  setPanel(`<h2>🚜 Garasi Kendaraan & Mobil</h2>
    <p>Kendaraan aktif: <b>${vehObj().icon} ${vehObj().n}</b> (Kecepatan <b>${Math.round(vehObj().spd * 100)}%</b> · Bonus Panen <b>+${Math.round(vehObj().harvBonus * 100)}%</b>)</p>` +
    VEHICLES.map(v => {
      const owned = S.vehicles.includes(v.id);
      const active = S.curVehicle === v.id;
      const can = S.coins >= v.p;
      return `<button class="opt ${active ? 'on' : ''}" ${(!owned && !can) ? 'disabled' : ''} onclick="selectOrBuyVehicle('${v.id}')">
        <b><span>${v.icon} ${v.n}</span><span>${active ? '✓ Dipakai' : owned ? 'Pakai' : '🪙 ' + v.p}</span></b>
        <span>${v.desc}</span>
      </button>`;
    }).join(''));
}

function selectOrBuyVehicle(id) {
  const v = VEHICLES.find(x => x.id === id);
  if (!v) return;
  if (S.vehicles.includes(id)) {
    S.curVehicle = id;
    save(); hud(); openGarage();
    toast(`${v.icon} Sekarang mengendarai ${v.n}!`);
    return;
  }
  if (S.coins < v.p) return;
  S.coins -= v.p;
  S.vehicles.push(id);
  S.curVehicle = id;
  spawnParticles(P.x, P.y, '#38bdf8', 22, 'harvest');
  save(); hud(); openGarage();
  toast(`🎉 Berhasil membeli ${v.icon} ${v.n}!`);
}

/* ============ MEMASAK (DAPUR) ============ */
function openKitchen() {
  const craftLv = skillLv('crafting');
  const craftBonus = 1 + (craftLv - 1) * 0.08 + (hasFurn('stove') ? 0.12 : 0);

  setPanel(`<h2>🍳 Dapur Memasak (Crafting Lv.${craftLv})</h2>
    <p>Olah hasil panen, ternak & buruan di Gudang menjadi hidangan bernilai tinggi (Bonus Masak: <b>+${Math.round((craftBonus - 1) * 100)}%</b>)!</p>` +
    RECIPES.map(r => {
      const reqStr = Object.entries(r.req).map(([k, q]) => `${k.toUpperCase()} (${S.inv[k] || 0}/${q})`).join(' + ');
      const canCook = Object.entries(r.req).every(([k, q]) => (S.inv[k] || 0) >= q);
      const finalSell = Math.round(r.sell * craftBonus * bonus());
      return `<button class="opt" ${!canCook ? 'disabled' : ''} onclick="cookRecipe('${r.id}')">
        <b><span>${r.icon} ${r.n}</span><span>Jual +${finalSell}🪙</span></b>
        <span>Bahan: ${reqStr}<br>${r.desc} (+${r.xp} EXP)</span>
      </button>`;
    }).join(''));
}

function cookRecipe(id) {
  const r = RECIPES.find(x => x.id === id);
  if (!r) return;
  const canCook = Object.entries(r.req).every(([k, q]) => (S.inv[k] || 0) >= q);
  if (!canCook) return;
  Object.entries(r.req).forEach(([k, q]) => { S.inv[k] -= q; });
  const craftLv = skillLv('crafting');
  const craftBonus = 1 + (craftLv - 1) * 0.08 + (hasFurn('stove') ? 0.12 : 0);
  const gain = Math.round(r.sell * craftBonus * bonus());
  S.coins += gain;
  S.exp += r.xp;
  S.skills.crafting = (S.skills.crafting || 0) + 18;
  save(); hud(); openKitchen();
  toast(`${r.icon} Masak ${r.n} sukses! Terjual +${gain} koin!`);
}

/* ============ BERBURU & MENAMBANG (HUTAN & TAMBANG) ============ */
function openHunt() {
  const now = Date.now();
  const huntCd = Math.max(0, 20000 - (now - (S.lastHunt || 0)));
  const mineCd = Math.max(0, 20000 - (now - (S.lastMine || 0)));
  const mLv = skillLv('mining');

  setPanel(`<h2>🏹 Hutan Berburu & Tambang</h2>
    <p>Cari sumber makanan daging liar, kayu hutan, dan tambang bijih mineral (Skill Mining Lv.${mLv}).</p>
    <button class="opt" ${huntCd > 0 ? 'disabled' : ''} onclick="doHunt()">
      <b><span>🦌 Berburu di Hutan Belantara</span><span>${huntCd > 0 ? fmt(huntCd) : 'Siap!'}</span></b>
      <span>Dapatkan Daging Buruan, Kayu & Koin (+EXP Farming & Crafting)</span>
    </button>
    <button class="opt" ${mineCd > 0 ? 'disabled' : ''} onclick="doMine()">
      <b><span>⛏️ Menambang Batu & Bijih Besi</span><span>${mineCd > 0 ? fmt(mineCd) : 'Siap!'}</span></b>
      <span>Dapatkan Batu, Bijih Besi & Koin (Bonus Skill Mining Lv.${mLv})</span>
    </button>
    <h3>🛠️ Crafting Pagar & Peralatan</h3>
    <button class="opt" ${(S.inv.kayu || 0) < 2 || (S.inv.batu || 0) < 1 ? 'disabled' : ''} onclick="craftTool()">
      <b><span>⚒️ Tempa Perkakas Tani Baja</span><span>+180🪙 & +50 EXP</span></b>
      <span>Bahan: KAYU (${S.inv.kayu || 0}/2) + BATU (${S.inv.batu || 0}/1)</span>
    </button>`);
}

function doHunt() {
  const now = Date.now();
  if (now - (S.lastHunt || 0) < 20000) return;
  S.lastHunt = now;
  const meat = 1 + (Math.random() < 0.45 ? 1 : 0);
  const wood = 1 + Math.floor(Math.random() * 2);
  const coinGain = Math.round((45 + Math.random() * 35) * bonus());
  if (totalInv() + meat + wood <= S.barnCap) {
    S.inv.daging = (S.inv.daging || 0) + meat;
    S.inv.kayu = (S.inv.kayu || 0) + wood;
  }
  S.coins += coinGain;
  S.exp += 25;
  S.skills.farming = (S.skills.farming || 0) + 12;
  spawnParticles(ZONES.hunt.x, ZONES.hunt.y, '#ef4444', 16, 'harvest');
  save(); hud(); openHunt();
  toast(`🏹 Hasil Berburu: +${meat} Daging, +${wood} Kayu & +${coinGain}🪙!`);
}

function doMine() {
  const now = Date.now();
  if (now - (S.lastMine || 0) < 20000) return;
  S.lastMine = now;
  const mLv = skillLv('mining');
  const stone = 1 + Math.floor(Math.random() * 2);
  const iron = Math.random() < (0.35 + mLv * 0.08) ? 1 : 0;
  const coinGain = Math.round((55 + mLv * 18) * bonus());
  if (totalInv() + stone + iron <= S.barnCap) {
    S.inv.batu = (S.inv.batu || 0) + stone;
    S.inv.besi = (S.inv.besi || 0) + iron;
  }
  S.coins += coinGain;
  S.exp += 30;
  S.skills.mining = (S.skills.mining || 0) + 20;
  spawnParticles(ZONES.hunt.x, ZONES.hunt.y, '#94a3b8', 16, 'dirt');
  save(); hud(); openHunt();
  toast(`⛏️ Hasil Tambang: +${stone} Batu, +${iron} Besi & +${coinGain}🪙!`);
}

function craftTool() {
  if ((S.inv.kayu || 0) < 2 || (S.inv.batu || 0) < 1) return;
  S.inv.kayu -= 2;
  S.inv.batu -= 1;
  const gain = Math.round(180 * bonus());
  S.coins += gain;
  S.exp += 50;
  S.skills.crafting = (S.skills.crafting || 0) + 25;
  save(); hud(); openHunt();
  toast(`⚒️ Perkakas berhasil ditempa! Terjual +${gain} koin!`);
}

function openSkillsTech() {
  const fLv = skillLv('farming'), mLv = skillLv('mining'), cLv = skillLv('crafting');
  let techHtml = TECHS.map(t => {
    const owned = hasTech(t.id);
    const lockLv = level() < t.lv;
    const can = !owned && !lockLv && S.coins >= t.p;
    return `<button class="opt ${owned ? 'on' : ''}" ${!can ? 'disabled' : ''} onclick="buyTech('${t.id}')">
      <b><span>${t.icon} ${t.n}</span><span>${owned ? '✓ Aktif' : lockLv ? '🔒 Lv.' + t.lv : '🪙 ' + t.p}</span></b>
      <span>${t.desc}</span>
    </button>`;
  }).join('');

  let secHtml = SECURITY.map((s, idx) => {
    if (idx === 0) return '';
    const owned = S.security === idx, lower = S.security > idx, can = S.coins >= s.p && !owned && !lower;
    return `<button class="opt ${owned ? 'on' : ''}" ${!can ? 'disabled' : ''} onclick="buySecurity(${idx})">
      <b><span>🛡️ ${s.n}</span><span>${owned ? '✓ Terpasang' : lower ? '✓ Dilewati' : '🪙 ' + s.p}</span></b>

    <div class="grid2">
      <div class="stat-card"><b>🌾 Farming Lv.${fLv}</b><span>XP: ${S.skills.farming || 0} (+${(fLv-1)*5}% hasil)</span></div>
      <div class="stat-card"><b>⛏️ Mining Lv.${mLv}</b><span>XP: ${S.skills.mining || 0} (+bijih besi)</span></div>
      <div class="stat-card"><b>🛠️ Crafting Lv.${cLv}</b><span>XP: ${S.skills.crafting || 0} (+${(cLv-1)*8}% masak)</span></div>
      <div class="stat-card"><b>🛡️ Proteksi: ${Math.round(SECURITY[S.security].prot*100)}%</b><span>${SECURITY[S.security].n}</span></div>

}

function buyTech(id) {
  const t = TECHS.find(x => x.id === id);
  if (!t || hasTech(id) || level() < t.lv || S.coins < t.p) return;
  S.coins -= t.p;
  S.techs.push(id);
  S.exp += 60;
  save(); hud(); openSkillsTech();
  toast(`🔬 Teknologi ${t.n} berhasil diaktifkan!`);
}

function buySecurity(idx) {
  const s = SECURITY[idx];
  if (!s || S.security >= idx || S.coins < s.p) return;
  S.coins -= s.p;
  S.security = idx;
  save(); hud(); openSkillsTech();
  toast(`🛡️ Keamanan ditingkatkan: ${s.n}!`);
}

function openLandShop(targetIdx = null) {
  const nextIdx = S.unlockedPlots;
  if (nextIdx >= PL.length) {
    return setPanel('<h2>Semua Lahan Terbuka!</h2><p>Kamu sudah memiliki maksimal <b>12 petak lahan</b> subur.</p>');
  }
  const price = LAND_PRICES[nextIdx];

  let html = `<h2>🌱 Perluas Lahan Kebun</h2><p>Lahan dimiliki: <b>${S.unlockedPlots} / ${PL.length} petak</b>. Beli lahan baru agar bisa menanam lebih banyak sekaligus!</p>`;
  for (let i = 6; i < PL.length; i++) {
    const owned = i < S.unlockedPlots;
    const isNext = i === S.unlockedPlots;
    const pr = LAND_PRICES[i];
    html += `<button class="opt ${owned ? 'on' : ''}" ${!isNext || S.coins < pr ? 'disabled' : ''} onclick="buyLand(${i})">

function buyLand(i) {

  S.coins -= price;

// Gambar Tanaman Lebih Realistis
function drawCrop(k, x, y, pr, now) {
  const sway = Math.sin(now / 350 + x) * (pr * 3.2);
  const h = k === 'tebu' ? 12 + pr * 36 : 9 + pr * 26;

  for (let i = -1; i <= 1; i++) {
    const bx = x + i * 15;
    const tx = bx + sway;
    const ty = y - h;

    ctx.strokeStyle = pr < 0.7 ? '#22c55e' : '#16a34a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bx, y - h * 0.35);
    ctx.quadraticCurveTo(bx - 8, y - h * 0.6, bx - 10 + sway * 0.5, y - h * 0.45);
    ctx.moveTo(bx, y - h * 0.55);
    ctx.quadraticCurveTo(bx + 8, y - h * 0.8, bx + 10 + sway * 0.5, y - h * 0.65);
    ctx.stroke();

    ctx.strokeStyle = pr < 0.7 ? '#4ade80' : (k === 'tebu' ? '#84cc16' : '#65a30d');
    ctx.lineWidth = k === 'tebu' ? 4 : 2.8;
    ctx.beginPath();
    ctx.moveTo(bx, y);
    ctx.quadraticCurveTo(bx + sway * 0.4, y - h * 0.5, tx, ty);
    ctx.stroke();

    if (pr >= 0.65) {
      ctx.fillStyle = CROPS[k]?.c || '#facc15';
      ctx.beginPath();
      ctx.ellipse(tx, ty + 2, 3.5, 6, 0.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// Gambar Player Stickman + Kendaraan (Gerobak / Motor / Traktor / Mobil Sport) + Animasi Cangkul & Sabit
function drawStickman(now) {
  ctx.save();
  ctx.translate(P.x, P.y);

  const d = P.dir;
  const vId = S.curVehicle;
  const v = vehObj();

  // Jika sedang mengendarai Mobil / Traktor / Motor / Gerobak (saat tidak mencangkul)
  if (vId !== 'none' && !P.anim) {
    ctx.save();
    ctx.scale(d, 1);
    // Bayangan kendaraan
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(0, 19, 22, 6, 0, 0, Math.PI * 2); ctx.fill();

    // Bodi kendaraan di bawah/sekitar Stickman
    ctx.fillStyle = v.col;
    if (vId === 'cart') {
      ctx.fillRect(-20, 2, 26, 12);
      ctx.strokeStyle = '#451a03'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(6, 8); ctx.lineTo(18, 4); ctx.stroke();
    } else if (vId === 'motor') {
      ctx.beginPath(); ctx.moveTo(-16, 12); ctx.lineTo(-4, 2); ctx.lineTo(14, 4); ctx.lineTo(18, 12); ctx.closePath(); ctx.fill();
    } else if (vId === 'tractor') {
      ctx.fillRect(-20, -4, 36, 18);
      ctx.fillStyle = '#14532d'; ctx.fillRect(-16, -18, 20, 14);
    } else {
      // Pickup / Sport GT
      ctx.beginPath();
      ctx.moveTo(-24, 14); ctx.lineTo(-22, 2); ctx.lineTo(-8, -6); ctx.lineTo(10, -6); ctx.lineTo(24, 4); ctx.lineTo(24, 14);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#bae6fd'; ctx.fillRect(-6, -4, 14, 7);
    }
    // Roda Kendaraan Berputar
    ctx.fillStyle = '#0f172a';
    const r1 = vId === 'tractor' ? 8 : 5.5;
    ctx.beginPath(); ctx.arc(-12, 15, r1, 0, Math.PI * 2); ctx.arc(13, 15, 5.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#cbd5e1';
    ctx.beginPath(); ctx.arc(-12, 15, 2.2, 0, Math.PI * 2); ctx.arc(13, 15, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Bayangan kaki standar
  if (vId === 'none' || P.anim) {
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.beginPath(); ctx.ellipse(0, 18, 12, 5, 0, 0, Math.PI * 2); ctx.fill();
  }

  let legSwing = P.moving ? Math.sin(P.walkCycle) * 8 : 0;
  let armSwing = P.moving ? -Math.sin(P.walkCycle) * 8 : Math.sin(now / 400) * 1.5;
  let bodyTilt = P.moving ? d * 0.08 : 0;
  let toolAngle = 0;

  if (P.anim) {
    const animProg = Math.min(1, (now - P.anim.start) / P.anim.dur);
    const strike = Math.sin(animProg * Math.PI * 3);
    bodyTilt = d * (0.25 + Math.abs(strike) * 0.22);
    legSwing = 4;
    toolAngle = strike * 1.15;

    if (animProg >= 0.45 && !P.anim.fxDone) {
      P.anim.fxDone = true;
      const q = PL[P.anim.plotIdx];
      spawnParticles(q.x + 32, q.y + 34, P.anim.type === 'plant' ? '#78350f' : '#facc15', 10, 'dirt');
    }
    if (animProg >= 1) {
      const doneAnim = P.anim;
      P.anim = null;
      if (doneAnim.type === 'plant') finalizePlant(doneAnim.plotIdx, doneAnim.cropKey);
      else if (doneAnim.type === 'harvest') harvest(doneAnim.plotIdx);
    }
  }

  ctx.rotate(bodyTilt);

  // Kaki Stickman
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#1e3a8a'; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, 4); ctx.lineTo(-5 + legSwing, 16);
  ctx.moveTo(0, 4); ctx.lineTo(5 - legSwing, 16);
  ctx.stroke();

  // Badan Stickman
  ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(0, 5); ctx.stroke();
  ctx.strokeStyle = '#10b981'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(0, 4); ctx.stroke();

  // Tangan & Alat Cangkul / Sabit
  ctx.save();
  ctx.translate(0, -9);
  if (P.anim) {
    ctx.rotate(d * (-0.5 + toolAngle));
    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 3.6;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(d * 12, 4); ctx.stroke();
    if (P.anim.type === 'plant') {
      ctx.strokeStyle = '#92400e'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(d * 4, 2); ctx.lineTo(d * 23, 10); ctx.stroke();
      ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(d * 22, 8); ctx.lineTo(d * 19, 16); ctx.stroke();
    } else {
      ctx.strokeStyle = '#facc15'; ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.arc(d * 17, 2, 8.5, d > 0 ? 0.2 : Math.PI - 1.8, d > 0 ? 1.9 : Math.PI - 0.2); ctx.stroke();
    }
  } else {
    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(d * 7 + armSwing * 0.5, 8); ctx.stroke();
  }
  ctx.restore();

  // Kepala & Topi Caping Petani
  ctx.fillStyle = '#fde68a'; ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.arc(0, -18.5, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#0f172a';
  ctx.beginPath(); ctx.arc(d * 2.5, -19, 1.3, 0, 7); ctx.arc(d * 5.5, -19, 1.3, 0, 7); ctx.fill();
  ctx.fillStyle = '#f59e0b'; ctx.strokeStyle = '#78350f'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.ellipse(0, -24, 12, 3.2, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -24, 6.5, Math.PI, 0); ctx.fill(); ctx.stroke();

  ctx.restore();
}

// Efek Cuaca (Hujan / Salju Musim Dingin / Banjir)
function drawWeather(now) {
  const sn = SEASONS[curSeasonIdx];
  const isRain = sn.id === 'hujan' || (activeDisaster && (activeDisaster.id === 'badai' || activeDisaster.id === 'banjir'));
  const isSnow = sn.id === 'dingin';

  if ((isRain || isSnow) && weatherDrops.length < 45) {
    weatherDrops.push({
      x: Math.random() * 400,
      y: -10,
      vy: isSnow ? 1.2 + Math.random() * 1.2 : 6 + Math.random() * 4,
      vx: isSnow ? Math.sin(now / 500) * 0.6 : -1.2
    });
  }

  ctx.save();
  weatherDrops.forEach(w => {
    if (isSnow) {
      ctx.fillStyle = 'rgba(241,245,249,0.8)';
      ctx.beginPath(); ctx.arc(w.x, w.y, 2.2, 0, Math.PI * 2); ctx.fill();
    } else if (isRain) {
      ctx.strokeStyle = 'rgba(125,211,252,0.55)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(w.x, w.y); ctx.lineTo(w.x + w.vx * 2, w.y + 9); ctx.stroke();
    }
    w.x += w.vx; w.y += w.vy;
  });
  weatherDrops = weatherDrops.filter(w => w.y < 610 && (isRain || isSnow));

  if (activeDisaster && activeDisaster.id === 'banjir') {
    ctx.fillStyle = 'rgba(14, 116, 144, 0.25)';
    ctx.fillRect(0, 210, 400, 390);
  }
  ctx.restore();
}

function draw() {
  const now = performance.now();
  const epoch = Date.now();
  const n = started ? near() : null;
  const sn = SEASONS[curSeasonIdx];

  // 1. Latar Sesuai Musim (Kemarau / Hujan / Dingin)
  const bgGrad = ctx.createLinearGradient(0, 0, 0, 600);
  bgGrad.addColorStop(0, sn.sky);
  bgGrad.addColorStop(0.28, sn.grass1);
  bgGrad.addColorStop(1, sn.grass2);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, 400, 600);

  ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
  for (let y = 175; y < 600; y += 36) ctx.fillRect(0, y, 400, 18);

  // Jalan Setapak Batu
  ctx.fillStyle = '#78716c';
  ctx.fillRect(172, 145, 28, 85);

  // 2. Bangunan Utama: Gudang, Rumah, Peternakan, Garasi, Hutan/Tambang
  drawBarnBuilding();
  drawHouse(S.house, now);
  drawRanchBuilding(now);
  drawBottomZones(now);
  drawSecurityFence();

  // Highlight Zona jika didekati
  if (n && n.t !== 'p') {
    const z = ZONES[n.t];
    if (z) {
      ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2.5;
      ctx.strokeRect(z.x - 42, z.y - 46, 84, 58);
    }
  }

  // 3. Gambar 12 Petak Lahan Kebun
  ctx.textAlign = 'center';
  ctx.font = '700 11px Fredoka, sans-serif';

  PL.forEach((q, i) => {
    const unlocked = i < S.unlockedPlots;
    ctx.fillStyle = 'rgba(0,0,0,0.26)';
    ctx.fillRect(q.x + 3, q.y + 4, 64, 64);

    if (unlocked) {
      ctx.fillStyle = hasTech('irigasi') ? '#0284c7' : '#92400e';
      ctx.fillRect(q.x - 2, q.y - 2, 68, 68);
      ctx.fillStyle = sn.id === 'dingin' && !hasTech('greenhouse') ? '#475569' : '#5c2d0c';
      ctx.fillRect(q.x, q.y, 64, 64);
      ctx.fillStyle = '#3b1906';
      for (let k = 1; k <= 4; k++) ctx.fillRect(q.x + 4, q.y + k * 12, 56, 3.5);

      const s = S.plots[i];
      if (s) {
        const pr = Math.min(1, (epoch - s.s) / (s.e - s.s));
        drawCrop(s.c, q.x + 32, q.y + 54, pr, now);
        ctx.fillStyle = pr >= 1 ? '#fde047' : '#ffffff';
        ctx.fillText(pr < 1 ? fmt(s.e - epoch) : '✨ Panen!', q.x + 32, q.y - 4 - (pr >= 1 ? Math.abs(Math.sin(now / 180)) * 3 : 0));
      }
    } else {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(q.x, q.y, 64, 64);
      ctx.strokeStyle = '#475569'; ctx.lineWidth = 2;
      ctx.setLineDash([5, 4]); ctx.strokeRect(q.x + 2, q.y + 2, 60, 60); ctx.setLineDash([]);
      ctx.fillStyle = '#d97706'; ctx.fillRect(q.x + 10, q.y + 18, 44, 18);
      ctx.fillStyle = '#fef08a'; ctx.font = '700 9.5px Fredoka, sans-serif';
      ctx.fillText(i === S.unlockedPlots ? '🪙 ' + LAND_PRICES[i] : '🔒 #' + (i + 1), q.x + 32, q.y + 30);
      ctx.font = '700 11px Fredoka, sans-serif';
    }

    if (n && n.t === 'p' && n.i === i) {
      ctx.strokeStyle = unlocked ? '#ffffff' : '#fbbf24';
      ctx.lineWidth = 3;
      ctx.strokeRect(q.x - 4, q.y - 4, 72, 72);
    }
  });

  // 4. Karakter Stickman & Kendaraan
  drawStickman(now);

  // 5. Partikel & Cuaca
  particles.forEach(pt => {
    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
    ctx.fillStyle = pt.c;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.sz, 0, Math.PI * 2); ctx.fill();
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.12; pt.life--;
  });
  ctx.globalAlpha = 1;
  particles = particles.filter(pt => pt.life > 0);

  drawWeather(now);

  // 6. Teks Melayang
  ctx.fillStyle = '#fbbf24';
  ctx.font = '700 14px Fredoka, sans-serif';
  floats.forEach(f => {
    ctx.globalAlpha = Math.min(1, f.t / 30);
    ctx.fillText(f.s, f.x, f.y - (75 - f.t) * .7);
    f.t--;
  });
  ctx.globalAlpha = 1;
  floats = floats.filter(f => f.t > 0);

  // 7. Tombol Aksi Kanan Bawah
  const b = $('act');
  if (!started || !n) {
    b.disabled = true; b.textContent = 'Dekati objek';
  } else if (P.anim) {
    b.disabled = true; b.textContent = P.anim.type === 'plant' ? 'Menanam…' : 'Memanen…';
  } else if (n.t !== 'p') {
    b.disabled = false; b.textContent = n.label;
  } else if (n.i >= S.unlockedPlots) {
    b.disabled = false;
    b.textContent = n.i === S.unlockedPlots ? `Beli (${LAND_PRICES[n.i]})` : 'Beli Lahan';
  } else {
    const q = S.plots[n.i];
    b.disabled = !!q && epoch < q.e;
    b.textContent = !q ? '🌱 Tanam' : epoch >= q.e ? '🌾 Panen' : 'Tumbuh ' + fmt(q.e - epoch);
  }
}

function loop() {
  let dx = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0) + jv.x;
  let dy = (keys.ArrowDown || keys.s ? 1 : 0) - (keys.ArrowUp || keys.w ? 1 : 0) + jv.y;
  const m = Math.hypot(dx, dy);
  if (m > 1) { dx /= m; dy /= m; }

  const spd = 3.1 * vehObj().spd;
  if ($('panel').classList.contains('hidden') && !P.anim) {
    P.moving = m > 0.08;
    if (P.moving) {
      if (Math.abs(dx) > 0.05) P.dir = dx > 0 ? 1 : -1;
      P.walkCycle += m * 0.28 * vehObj().spd;
    }
    P.x = Math.max(16, Math.min(384, P.x + dx * spd));
    P.y = Math.max(115, Math.min(575, P.y + dy * spd));
  } else {
    P.moving = false;
  }

  draw();
  requestAnimationFrame(loop);
}

/* ============ INPUT ============ */
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys[k] = true;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
  if (k === 'e' || k === ' ' || k === 'Enter') act();
  if (k === 'Escape') closePanel();
});
addEventListener('keyup', e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
$('act').onclick = act;

const jz = $('joyZone'), kn = $('knob'); let jid = null;
function jmove(e) {
  const r = jz.getBoundingClientRect(), R = r.width / 2 - 10;
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2), d = Math.hypot(dx, dy);
  if (d > R) { dx *= R / d; dy *= R / d; }
  jv = { x: dx / R, y: dy / R }; kn.style.transform = `translate(${dx}px,${dy}px)`;
}
jz.addEventListener('pointerdown', e => { jid = e.pointerId; jz.setPointerCapture(jid); jmove(e); });
jz.addEventListener('pointermove', e => { if (e.pointerId === jid) jmove(e); });
const jend = e => { if (e.pointerId === jid) { jid = null; jv = { x: 0, y: 0 }; kn.style.transform = 'translate(0,0)'; } };
jz.addEventListener('pointerup', jend); jz.addEventListener('pointercancel', jend);

loop(); boot();
</script>
