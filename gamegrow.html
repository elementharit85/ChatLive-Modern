<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NexGrow — Kebun & Rumah</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1120;--panel:#0f172a;--line:#1e293b;--text:#e2e8f0;--mute:#94a3b8;--brand:#34d399;--warn:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Fredoka',system-ui,sans-serif;overflow:hidden;touch-action:none}
#app{height:100%;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#stage{position:relative;height:min(100dvh - 16px,820px);aspect-ratio:2/3;max-width:100%;border-radius:20px;overflow:hidden;border:2px solid var(--line);background:#14532d}
@media(max-width:600px){#stage{height:100dvh;width:100%;aspect-ratio:auto;border:0;border-radius:0}}
canvas{width:100%;height:100%;display:block;object-fit:contain}
.hidden{display:none!important}
.hud{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:8px;align-items:center;pointer-events:none}
.chip{background:rgba(15,23,42,.85);border:1px solid var(--line);border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:6px;font-weight:700;backdrop-filter:blur(4px)}
.coin{width:14px;height:14px;border-radius:50%;background: radial-gradient(circle at 30% 30%, #fde047, #d97706);display:inline-block;box-shadow:0 0 6px rgba(251,191,36,.6)}
.lv{flex:1;flex-direction:column;align-items:stretch;gap:3px;font-size:13px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
#xpbar{height:100%;background:linear-gradient(90deg,#10b981,#34d399);width:0;transition:width .3s}
.lv small{color:var(--mute);font-weight:500;font-size:11px}
.top2{position:absolute;top:58px;left:8px;display:flex;gap:6px}
.mini{font:inherit;font-size:13px;font-weight:700;background:rgba(15,23,42,.85);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 12px;text-decoration:none;cursor:pointer;backdrop-filter:blur(4px)}
#joyZone{position:absolute;left:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:rgba(15,23,42,.45);border:2px solid rgba(226,232,240,.35);touch-action:none;display:flex;align-items:center;justify-content:center}
#knob{width:52px;height:52px;border-radius:50%;background:rgba(52,211,153,.85);border:2px solid #052e22;pointer-events:none}
#act{position:absolute;right:20px;bottom:calc(36px + env(safe-area-inset-bottom));min-width:112px;height:84px;border-radius:24px;border:0;background:var(--brand);color:#052e22;font:inherit;font-weight:700;font-size:16px;padding:0 16px;cursor:pointer;box-shadow:0 6px 20px rgba(52,211,153,.35)}
#act:disabled{background:#334155;color:var(--mute);box-shadow:none}
#panel{position:absolute;inset:0;background:rgba(11,17,32,.9);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.box{width:100%;max-width:340px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.box h2{margin:0;font-size:20px}.box p{margin:0;color:var(--mute);font-size:13px}
.opt{font:inherit;color:var(--text);text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.opt b{font-size:16px}.opt span{font-size:12px;color:var(--mute)}
.opt:disabled{opacity:.5}.opt.on{border-color:var(--brand)}
.close{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px;background:var(--line);color:var(--text);cursor:pointer;text-align:center;text-decoration:none}
.row{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--bg);border-radius:10px;padding:6px 8px}
.row img{width:26px;height:26px;border-radius:8px}.row .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .s{color:var(--brand);font-weight:700;text-align:right;font-size:12px}
#toast{position:absolute;left:50%;top:104px;transform:translateX(-50%);background:var(--brand);color:#052e22;font-weight:700;padding:8px 14px;border-radius:12px;font-size:14px;z-index:6;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div id="app"><div id="stage">
  <canvas id="cv" width="400" height="600"></canvas>
  <div class="hud">
    <div class="chip"><i class="coin"></i><b id="coins">0</b></div>
    <div class="chip lv"><span id="lvl">Lv 1</span><div class="bar"><div id="xpbar"></div></div><small id="xptxt"></small></div>
  </div>
  <div class="top2">
    <a class="mini" href="game.html">Menu game</a>
    <button class="mini" onclick="openLandShop()">+ Lahan</button>
    <button class="mini" onclick="openHow()" title="Cara bermain" aria-label="Cara bermain">?</button>
    <button class="mini" onclick="openRank()">Peringkat</button>
  </div>
  <div id="joyZone"><div id="knob"></div></div>
  <button id="act" disabled>Dekati kebun</button>
  <div id="toast" class="hidden"></div>
  <div id="panel"><div class="box"><h2>Memeriksa akun…</h2></div></div>
</div></div>

<script>
/* ============ SUPABASE (TIDAK DIUBAH) ============ */
const SUPABASE_URL = 'https://zyddldgtefrtwjgymbtk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_hrVo6BmPk-4b8YQozWzn9g_4xJlLwa-';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============ DATA GAME ============ */
const BASE_MIN = 5; // menit tunggu dasar (ubah ke 0.2 untuk uji coba cepat)
const CROPS = {
  padi:   { n: 'Padi Emas',   lv: 1, v: 20,  xp: 10, c: '#facc15' },
  jagung: { n: 'Jagung Manis',lv: 2, v: 60,  xp: 25, c: '#fde047' },
  tebu:   { n: 'Tebu Manis',  lv: 3, v: 150, xp: 60, c: '#4ade80' }
};

// Update Rumah: Ditambah Mansion Mewah & Istana Sultan
const HOUSES = [
  { n: 'Gubuk Bambu',   p: 0,     b: 1.0,  desc: 'Tempat berteduh sederhana dari kayu & jerami.' },
  { n: 'Rumah Kayu',    p: 400,   b: 1.1,  desc: 'Rumah kayu pinus hangat dengan cerobong batu.' },
  { n: 'Rumah Batu',    p: 2000,  b: 1.25, desc: 'Rumah dinding batu kokoh dengan atap genteng.' },
  { n: 'Villa Modern',  p: 8000,  b: 1.5,  desc: 'Villa 2 lantai berjendela kaca lebar & taman.' },
  { n: 'Mansion Mewah', p: 25000, b: 1.8,  desc: 'Mansion megah berpilar marmer & balkon emas.' },
  { n: 'Istana Sultan', p: 75000, b: 2.2,  desc: 'Istana kasta tertinggi dengan menara kembar & air mancur.' }
];

// 12 Petak Lahan (4 kolom x 3 baris) — 6 lahan pertama terbuka gratis, lahan 7-12 bisa dibeli
const PL = [
  // Baris 1 & 2 (6 Lahan Awal Gratis)
  [24, 210], [116, 210], [208, 210],
  [24, 300], [116, 300], [208, 300],
  // Lahan Tambahan yang Bisa Dibeli (Petak 7 - 12)
  [300, 210], [300, 300],
  [24, 390], [116, 390], [208, 390], [300, 390]
].map(([x, y]) => ({ x, y }));

// Harga beli untuk petak ke-7 sampai ke-12 (indeks 6..11)
const LAND_PRICES = [0, 0, 0, 0, 0, 0, 150, 350, 750, 1500, 3000, 6000];

let S = { coins: 0, exp: 0, house: 0, unlockedPlots: 6, plots: Array(12).fill(null) };
let U = null, ready = false, LS = '', started = false, saveT = null;
const level = () => 1 + Math.floor(Math.sqrt(S.exp / 40));
const growMs = () => Math.min(4, 1 + .2 * (level() - 1)) * BASE_MIN * 60000;
const bonus = () => (HOUSES[S.house] || HOUSES[0]).b;
const fmt = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

/* ============ AUTH + SIMPAN (SISTEM TETAP SAMA) ============ */
function setPanel(html, closable = true) {
  $('panel').innerHTML = '<div class="box">' + html + (closable ? '<button class="close" onclick="closePanel()">Tutup</button>' : '') + '</div>';
  $('panel').classList.remove('hidden');
}
function closePanel() { if (started) $('panel').classList.add('hidden'); }
function bad(m) { setPanel('<h2>Belum masuk</h2><p>' + esc(m) + '</p><a class="close" style="background:var(--brand);color:#052e22" href="index.html">Ke halaman chat</a>', false); }
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.remove('hidden'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.add('hidden'), 2400); }

async function boot() {
  const ps = new URLSearchParams(location.search); let s = null;
  try { s = JSON.parse(localStorage.getItem('nexchat_session_user') || 'null'); } catch (e) {}
  const ph = ps.get('phone') || s?.phone_4;
  if (!ph || !s || s.phone_4 !== ph) return bad('Sesi chat tidak ditemukan. Masuk dulu lewat halaman chat.');
  U = { phone_4: s.phone_4, display_name: s.display_name, avatar_url: s.avatar_url };
  try {
    const { data, error } = await sb.from('chat_users').select('phone_4,pin,display_name,avatar_url').eq('phone_4', ph).maybeSingle();
    if (!error && data) {
      if (data.pin !== s.pin) return bad('PIN tidak cocok. Masuk ulang lewat halaman chat.');
      U = { phone_4: data.phone_4, display_name: data.display_name, avatar_url: data.avatar_url || s.avatar_url };
    }
  } catch (e) {}
  history.replaceState(null, '', location.pathname);
  LS = 'nexgrow_' + U.phone_4;
  let local = null, remote = null;
  try { local = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) {}
  try {
    const { error } = await sb.from('game_scores').select('phone_4,game,data').limit(1); ready = !error;
    if (ready) { const { data } = await sb.from('game_scores').select('data').eq('phone_4', U.phone_4).eq('game', 'grow').maybeSingle(); remote = data?.data; }
  } catch (e) {}
  const pick = [remote, local].filter(Boolean).sort((a, b) => (b.exp || 0) - (a.exp || 0))[0];
  if (pick) {
    const up = Math.max(6, Math.min(12, pick.unlockedPlots || (pick.plots ? pick.plots.length : 6)));
    S = {
      coins: pick.coins || 0,
      exp: pick.exp || 0,
      house: Math.min(HOUSES.length - 1, pick.house || 0),
      unlockedPlots: up,
      plots: Array.from({ length: 12 }, (_, i) => pick.plots?.[i] || null)
    };
  }
  started = true; closePanel(); hud();
  if (!ready) toast('Supabase belum siap — progres hanya di perangkat ini');
}
function save() {
  localStorage.setItem(LS, JSON.stringify(S));
  if (!ready) return;
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    const { error } = await sb.from('game_scores').upsert({
      phone_4: U.phone_4, game: 'grow', display_name: U.display_name, avatar_url: U.avatar_url,
      best_score: S.exp, data: S, updated_at: new Date().toISOString()
    }, { onConflict: 'phone_4,game' });
    if (error) toast('Gagal simpan: ' + error.message);
  }, 700);
}
setInterval(() => { if (started) save(); }, 30000);

/* ============ STICKMAN, PARTIKEL & AKSI ============ */
let P = {
  x: 200, y: 185,
  dir: 1,          // 1 menghadap kanan, -1 menghadap kiri
  walkCycle: 0,    // siklus langkah kaki
  moving: false,
  anim: null       // { type: 'plant' | 'harvest', start: ms, dur: ms, plotIdx: i, cropKey: k }
};
let floats = [], particles = [], smokes = [], keys = {}, jv = { x: 0, y: 0 };

function spawnParticles(x, y, color, count = 12, type = 'dirt') {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 2.8;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - (type === 'harvest' ? 2.2 : 1.2),
      c: color,
      sz: type === 'harvest' ? 3 + Math.random() * 3 : 2 + Math.random() * 2.5,
      life: 28 + Math.floor(Math.random() * 18),
      maxLife: 45,
      type
    });
  }
}

function near() {
  let b = null, bd = 56;
  PL.forEach((q, i) => {
    const d = Math.hypot(P.x - (q.x + 34), P.y - (q.y + 34));
    if (d < bd) { bd = d; b = { t: 'p', i }; }
  });
  if (Math.hypot(P.x - 200, P.y - 165) < bd) b = { t: 'h' };
  return b;
}

function act() {
  if (!started || !$('panel').classList.contains('hidden') || P.anim) return;
  const n = near(); if (!n) return;
  if (n.t === 'h') return openHouse();
  // Jika petak belum dibeli, buka dialog beli lahan
  if (n.i >= S.unlockedPlots) return openLandShop(n.i);
  const q = S.plots[n.i];
  if (!q) return openCrops(n.i);
  if (Date.now() >= q.e) startHarvestAnim(n.i);
}

function openCrops(i) {
  setPanel('<h2>Tanam apa?</h2><p>Waktu tumbuh: ' + fmt(growMs()) + ' (makin lama di level tinggi)</p>' +
    Object.entries(CROPS).map(([k, c]) => {
      const lock = level() < c.lv;
      return `<button class="opt" ${lock ? 'disabled' : ''} onclick="plant(${i},'${k}')"><b>🌾 ${c.n}</b><span>${lock ? '🔒 Butuh Level ' + c.lv : 'Jual ' + Math.round(c.v * bonus()) + ' koin · +' + c.xp + ' EXP'}</span></button>`;
    }).join(''));
}

function plant(i, k) {
  if (i >= S.unlockedPlots || S.plots[i] || level() < CROPS[k].lv || P.anim) return;
  closePanel();
  // Posisikan menghadap petak & mulai animasi Stickman Mencangkul + Menebar Bibit
  const px = PL[i].x + 34;
  P.dir = px >= P.x ? 1 : -1;
  P.anim = { type: 'plant', start: performance.now(), dur: 950, plotIdx: i, cropKey: k, fxDone: false };
}

function finalizePlant(i, k) {
  const now = Date.now();
  S.plots[i] = { c: k, s: now, e: now + growMs() };
  spawnParticles(PL[i].x + 34, PL[i].y + 42, '#78350f', 14, 'dirt');
  spawnParticles(PL[i].x + 34, PL[i].y + 36, '#fde047', 8, 'seed');
  save();
}

function startHarvestAnim(i) {
  const q = S.plots[i];
  if (!q || Date.now() < q.e || P.anim) return;
  const px = PL[i].x + 34;
  P.dir = px >= P.x ? 1 : -1;
  P.anim = { type: 'harvest', start: performance.now(), dur: 850, plotIdx: i, fxDone: false };
}

function harvest(i) {
  const q = S.plots[i]; if (!q) return;
  const c = CROPS[q.c], gain = Math.round(c.v * bonus()), old = level();
  S.coins += gain; S.exp += c.xp; S.plots[i] = null;
  spawnParticles(PL[i].x + 34, PL[i].y + 34, c.c, 18, 'harvest');
  spawnParticles(PL[i].x + 34, PL[i].y + 34, '#22c55e', 10, 'harvest');
  floats.push({ x: PL[i].x + 34, y: PL[i].y, t: 75, s: '+' + gain + ' 🪙' });
  if (level() > old) toast('🎉 Naik ke Level ' + level() + '! Tanaman makin bernilai.');
  save(); hud();
}

/* ============ BELI LAHAN BARU ============ */
function openLandShop(targetIdx = null) {
  const nextIdx = S.unlockedPlots;
  if (nextIdx >= PL.length) {
    return setPanel('<h2>Semua Lahan Terbuka!</h2><p>Kamu sudah memiliki maksimal <b>12 petak lahan</b> subur.</p>');
  }
  const price = LAND_PRICES[nextIdx];
  const can = S.coins >= price;
  let html = `<h2>Perluas Lahan Kebun</h2><p>Lahan dimiliki: <b>${S.unlockedPlots} / ${PL.length} petak</b>. Beli lahan baru agar bisa menanam lebih banyak sekaligus!</p>`;
  for (let i = 6; i < PL.length; i++) {
    const owned = i < S.unlockedPlots;
    const isNext = i === S.unlockedPlots;
    const pr = LAND_PRICES[i];
    html += `<button class="opt ${owned ? 'on' : ''}" ${!isNext || S.coins < pr ? 'disabled' : ''} onclick="buyLand(${i})">
      <b>🌱 Petak Lahan #${i + 1}</b>
      <span>${owned ? '✓ Sudah dimiliki' : isNext ? (pr + ' koin' + (can ? ' — Klik untuk beli!' : ' (kurang ' + (pr - S.coins) + ' koin)')) : '🔒 Buka Petak #' + i + ' dulu (' + pr + ' koin)'}</span>
    </button>`;
  }
  setPanel(html);
}

function buyLand(i) {
  if (i !== S.unlockedPlots || i >= PL.length) return;
  const price = LAND_PRICES[i];
  if (S.coins < price) return;
  S.coins -= price;
  S.unlockedPlots++;
  const q = PL[i];
  spawnParticles(q.x + 34, q.y + 34, '#34d399', 20, 'harvest');
  floats.push({ x: q.x + 34, y: q.y, t: 75, s: 'Lahan #' + (i + 1) + ' Terbuka!' });
  save(); hud(); openLandShop();
  toast('🌱 Petak Lahan #' + (i + 1) + ' berhasil dibeli!');
}

/* ============ UPDATE RUMAH ============ */
function openHouse() {
  const cur = HOUSES[S.house] || HOUSES[0];
  setPanel('<h2>🏠 ' + cur.n + '</h2><p>' + cur.desc + '<br>Bonus panen saat ini: <b>+' + Math.round((bonus() - 1) * 100) + '% koin</b>.</p>' +
    HOUSES.map((h, i) => {
      if (!i) return '';
      const own = S.house === i, lower = S.house > i, can = S.coins >= h.p;
      return `<button class="opt ${own ? 'on' : ''}" ${own || lower || !can ? 'disabled' : ''} onclick="buyHouse(${i})">
        <b>${h.n} (+${Math.round((h.b - 1) * 100)}% Koin)</b>
        <span>${h.desc}<br>${own ? '✓ Rumahmu sekarang' : lower ? '✓ Sudah dilewati' : '🪙 ' + h.p + ' koin' + (can ? '' : ' (kurang ' + (h.p - S.coins) + ')')}</span>
      </button>`;
    }).join(''));
}

function buyHouse(i) {
  const h = HOUSES[i]; if (S.house >= i || S.coins < h.p) return;
  S.coins -= h.p; S.house = i;
  spawnParticles(200, 130, '#fbbf24', 26, 'harvest');
  save(); hud(); openHouse(); toast('🏡 Selamat! Kini kamu punya ' + h.n + '!');
}

function openHow() {
  setPanel('<h2>Cara bermain</h2>' + [
    ['Gerak Stickman', 'Gunakan <b>joystick</b> di kiri bawah (atau WASD / tombol panah) untuk menggerakkan petani Stickman.'],
    ['Tanam & Animasi', 'Dekati petak kosong, tekan <b>Tanam</b>, lalu pilih bibit. Stickman akan mencangkul dan menebar benih!'],
    ['Panen Sabit', 'Saat tanaman matang, tekan <b>Panen</b>. Stickman akan mengayunkan sabit untuk memanen koin + EXP.'],
    ['Beli Lahan Baru', 'Dekati lahan terkunci (atau klik tombol <b>+ Lahan</b>) untuk membeli hingga <b>12 petak kebun</b>.'],
    ['Upgrade Rumah', 'Dekati rumah di atas peta untuk meng-upgrade hingga <b>Mansion Mewah & Istana Sultan</b> (bonus panen s/d +120%).']
  ].map(r => '<div class="opt" style="cursor:default"><b>' + r[0] + '</b><span style="color:var(--text);font-size:13px">' + r[1] + '</span></div>').join(''));
}

async function openRank() {
  if (!ready) return setPanel('<h2>Peringkat</h2><p>Belum tersambung ke Supabase.</p>');
  setPanel('<h2>Peringkat</h2><p>Memuat…</p>');
  const { data } = await sb.from('game_scores').select('phone_4,display_name,avatar_url,best_score,data').eq('game', 'grow').order('best_score', { ascending: false }).limit(10);
  setPanel('<h2>Peringkat EXP & Rumah</h2>' + ((data || []).map((r, i) => {
    const hIdx = Math.min(HOUSES.length - 1, r.data?.house || 0);
    const plotsCnt = r.data?.unlockedPlots || 6;
    return `<div class="row"><span>${i + 1}</span><img src="${esc(r.avatar_url)}" alt=""><span class="n">${esc(r.display_name)}</span><span class="s">${r.best_score} EXP<br>${esc(HOUSES[hIdx].n)} (${plotsCnt} Lahan)</span></div>`;
  }).join('') || '<p>Belum ada data.</p>'));
}

function hud() {
  const L = level(), lo = 40 * (L - 1) ** 2, hi = 40 * L * L;
  const hName = (HOUSES[S.house] || HOUSES[0]).n;
  $('coins').textContent = S.coins;
  $('lvl').textContent = `Lv ${L} · ${hName} (${S.unlockedPlots}/12 Lahan)`;
  $('xpbar').style.width = Math.min(100, (S.exp - lo) / (hi - lo) * 100) + '%';
  $('xptxt').textContent = S.exp + ' / ' + hi + ' EXP';
}

/* ============ GRAFIS REALISTIS (RUMAH, TANAMAN, STICKMAN) ============ */
const cv = $('cv'), ctx = cv.getContext('2d');

// 1. Gambar Rumah Realistis (6 Level Upgrade)
function drawHouse(t, now) {
  const cx = 200, by = 152;
  ctx.save();

  const widths = [82, 110, 134, 156, 178, 200];
  const w = widths[t] || 82;
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.ellipse(cx, by + 4, w * 0.56, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  if (t >= 1 && Math.random() < 0.08) {

// 2. Gambar Tanaman Lebih Realistis
function drawCrop(k, x, y, pr, now) {
  const sway = Math.sin(now / 350 + x) * (pr * 3.5);
  const h = k === 'tebu' ? 14 + pr * 42 : 10 + pr * 30;

  for (let i = -1; i <= 1; i++) {
    const bx = x + i * 17;
    const tx = bx + sway;
    const ty = y - h;

    ctx.strokeStyle = pr < 0.7 ? '#22c55e' : '#16a34a';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(bx, y - h * 0.35);
    ctx.quadraticCurveTo(bx - 10, y - h * 0.6, bx - 12 + sway * 0.5, y - h * 0.45);
    ctx.moveTo(bx, y - h * 0.55);
    ctx.quadraticCurveTo(bx + 10, y - h * 0.8, bx + 12 + sway * 0.5, y - h * 0.65);
    ctx.stroke();

    ctx.strokeStyle = pr < 0.7 ? '#4ade80' : (k === 'tebu' ? '#84cc16' : '#65a30d');
    ctx.lineWidth = k === 'tebu' ? 4.5 : 3;
    ctx.beginPath();
    ctx.moveTo(bx, y);
    ctx.quadraticCurveTo(bx + sway * 0.4, y - h * 0.5, tx, ty);
    ctx.stroke();

    if (pr >= 0.65) {
      if (k === 'padi') {
        ctx.fillStyle = '#facc15';
        for (let g = 0; g < 4; g++) {
          ctx.beginPath();
          ctx.ellipse(tx + (g - 1.5) * 2.5, ty + g * 2.2, 2.5, 4, 0.4, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (k === 'jagung') {
        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.ellipse(tx, y - h * 0.62, 4.5, 9, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(tx - 2, y - h * 0.66, 4, 2);
        ctx.fillRect(tx - 2, y - h * 0.58, 4, 2);
      } else {
        ctx.fillStyle = '#581c87';
        ctx.fillRect(bx - 2.5 + sway * 0.3, y - h * 0.35, 5, 2.5);
        ctx.fillRect(bx - 2.5 + sway * 0.6, y - h * 0.68, 5, 2.5);
        ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(tx, ty); ctx.lineTo(tx - 9, ty - 8);
        ctx.moveTo(tx, ty); ctx.lineTo(tx + 9, ty - 8);
        ctx.stroke();
      }
    }
  }
}

// 3. Gambar Player Stickman Petani + Animasi Tanam & Panen
function drawStickman(now) {
  ctx.save();
  ctx.translate(P.x, P.y);

  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.beginPath();
  ctx.ellipse(0, 18, 12, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  const d = P.dir;
  let legSwing = P.moving ? Math.sin(P.walkCycle) * 8 : 0;
  let armSwing = P.moving ? -Math.sin(P.walkCycle) * 8 : Math.sin(now / 400) * 1.5;
  let bodyTilt = P.moving ? d * 0.08 : 0;
  let toolAngle = 0;
  let animProg = 0;

  if (P.anim) {
    animProg = Math.min(1, (now - P.anim.start) / P.anim.dur);
    const strike = Math.sin(animProg * Math.PI * 3);
    bodyTilt = d * (0.25 + Math.abs(strike) * 0.22);
    legSwing = 4;
    toolAngle = strike * 1.15;

    if (animProg >= 0.45 && !P.anim.fxDone) {
      P.anim.fxDone = true;
      const q = PL[P.anim.plotIdx];
      spawnParticles(q.x + 34, q.y + 38, P.anim.type === 'plant' ? '#78350f' : '#facc15', 10, 'dirt');
    }
    if (animProg >= 1) {
      const doneAnim = P.anim;
      P.anim = null;
      if (doneAnim.type === 'plant') finalizePlant(doneAnim.plotIdx, doneAnim.cropKey);
      else if (doneAnim.type === 'harvest') harvest(doneAnim.plotIdx);
    }
  }

  ctx.rotate(bodyTilt);

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#1e3a8a';
  ctx.lineWidth = 4.2;
  ctx.beginPath();
  ctx.moveTo(0, 4); ctx.lineTo(-5 + legSwing, 17);
  ctx.moveTo(0, 4); ctx.lineTo(5 - legSwing, 17);
  ctx.stroke();

  ctx.fillStyle = '#451a03';
  ctx.fillRect(-8 + legSwing, 15, 6, 4);
  ctx.fillRect(3 - legSwing, 15, 6, 4);

  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(0, -12);
  ctx.lineTo(0, 5);
  ctx.stroke();

  ctx.strokeStyle = '#10b981';
  ctx.lineWidth = 3.2;
  ctx.beginPath();
  ctx.moveTo(0, -11);
  ctx.lineTo(0, 4);
  ctx.stroke();

  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(0, -9);
  ctx.lineTo(-d * 7 - armSwing * 0.5, 1);
  ctx.stroke();

  ctx.save();
  ctx.translate(0, -9);
  if (P.anim) {
    ctx.rotate(d * (-0.5 + toolAngle));
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 3.8;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(d * 12, 4);
    ctx.stroke();

    if (P.anim.type === 'plant') {
      ctx.strokeStyle = '#92400e';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(d * 4, 2);
      ctx.lineTo(d * 24, 10);
      ctx.stroke();
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(d * 23, 8);
      ctx.lineTo(d * 20, 17);
      ctx.stroke();
    } else if (P.anim.type === 'harvest') {
      ctx.strokeStyle = '#92400e';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(d * 6, 2);
      ctx.lineTo(d * 14, 6);
      ctx.stroke();
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(d * 18, 2, 9, d > 0 ? 0.2 : Math.PI - 1.8, d > 0 ? 1.9 : Math.PI - 0.2);
      ctx.stroke();
    }
  } else {
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(d * 7 + armSwing * 0.6, 9);
    ctx.stroke();
  }
  ctx.restore();

  ctx.fillStyle = '#fde68a';
  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(0, -19, 7.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(d * 2.8, -19.5, 1.4, 0, Math.PI * 2);
  ctx.arc(d * 6.0, -19.5, 1.4, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#f59e0b';
  ctx.strokeStyle = '#78350f';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(0, -25, 13, 3.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, -25, 7, Math.PI, 0);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(-6.5, -26.5, 13, 2);

  ctx.restore();
}

function draw() {
  const now = performance.now();
  const epoch = Date.now();
  const n = started ? near() : null;

  const bgGrad = ctx.createLinearGradient(0, 0, 0, 600);
  bgGrad.addColorStop(0, '#065f46');
  bgGrad.addColorStop(0.28, '#15803d');
  bgGrad.addColorStop(1, '#14532d');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, 400, 600);

  ctx.fillStyle = 'rgba(22, 163, 74, 0.35)';
  for (let y = 160; y < 600; y += 36) ctx.fillRect(0, y, 400, 18);

  ctx.fillStyle = '#064e3b';
  [[38, 138, 22], [65, 145, 16], [362, 138, 22], [335, 145, 16]].forEach(([bx, by, br]) => {
    ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#047857';
    ctx.beginPath(); ctx.arc(bx - 4, by - 4, br * 0.75, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#064e3b';
  });

  ctx.fillStyle = '#78716c';
  ctx.fillRect(182, 150, 36, 56);
  ctx.fillStyle = '#a8a29e';
  [[186, 155], [202, 158], [188, 172], [204, 176], [190, 190], [202, 193]].forEach(([sx, sy]) => {
    ctx.beginPath(); ctx.ellipse(sx + 5, sy + 4, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
  });

  drawHouse(S.house, now);
  if (n && n.t === 'h') {
    ctx.strokeStyle = '#34d399'; ctx.lineWidth = 3;
    ctx.strokeRect(145, 84, 110, 74);
  }

  ctx.textAlign = 'center';
  ctx.font = '700 12px Fredoka, sans-serif';

  PL.forEach((q, i) => {
    const unlocked = i < S.unlockedPlots;
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.fillRect(q.x + 3, q.y + 4, 68, 68);

    if (unlocked) {
      ctx.fillStyle = '#92400e';
      ctx.fillRect(q.x - 2, q.y - 2, 72, 72);
      ctx.fillStyle = '#5c2d0c';
      ctx.fillRect(q.x, q.y, 68, 68);
      ctx.fillStyle = '#3b1906';
      for (let k = 1; k <= 4; k++) ctx.fillRect(q.x + 4, q.y + k * 13, 60, 4);

      const s = S.plots[i];
      if (s) {
        const pr = Math.min(1, (epoch - s.s) / (s.e - s.s));
        drawCrop(s.c, q.x + 34, q.y + 58, pr, now);
        ctx.fillStyle = pr >= 1 ? '#fde047' : '#ffffff';
        ctx.fillText(pr < 1 ? fmt(s.e - epoch) : '✨ Panen!', q.x + 34, q.y - 5 - (pr >= 1 ? Math.abs(Math.sin(now / 180)) * 4 : 0));
      }
    } else {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(q.x, q.y, 68, 68);
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 4]);
      ctx.strokeRect(q.x + 2, q.y + 2, 64, 64);
      ctx.setLineDash([]);

      ctx.fillStyle = '#78350f';
      ctx.fillRect(q.x + 31, q.y + 32, 6, 20);
      ctx.fillStyle = '#d97706';
      ctx.fillRect(q.x + 12, q.y + 16, 44, 20);
      ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.5;
      ctx.strokeRect(q.x + 12, q.y + 16, 44, 20);

      ctx.fillStyle = '#fef08a';
      ctx.font = '700 10px Fredoka, sans-serif';
      ctx.fillText(i === S.unlockedPlots ? '🪙 ' + LAND_PRICES[i] : '🔒 #' + (i + 1), q.x + 34, q.y + 29);
      ctx.font = '700 12px Fredoka, sans-serif';
    }

    if (n && n.t === 'p' && n.i === i) {
      ctx.strokeStyle = unlocked ? '#ffffff' : '#fbbf24';
      ctx.lineWidth = 3;
      ctx.strokeRect(q.x - 4, q.y - 4, 76, 76);
    }
  });

  drawStickman(now);

  particles.forEach(pt => {
    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
    ctx.fillStyle = pt.c;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.sz, 0, Math.PI * 2);
    ctx.fill();
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vy += 0.12;
    pt.life--;
  });
  ctx.globalAlpha = 1;
  particles = particles.filter(pt => pt.life > 0);

  ctx.fillStyle = '#fbbf24';
  ctx.font = '700 16px Fredoka, sans-serif';
  floats.forEach(f => {
    ctx.globalAlpha = Math.min(1, f.t / 30);
    ctx.fillText(f.s, f.x, f.y - (75 - f.t) * .8);
    f.t--;
  });
  ctx.globalAlpha = 1;
  floats = floats.filter(f => f.t > 0);

  const b = $('act');
  if (!started || !n) {
    b.disabled = true; b.textContent = 'Dekati kebun';
  } else if (P.anim) {
    b.disabled = true; b.textContent = P.anim.type === 'plant' ? 'Menanam…' : 'Memanen…';
  } else if (n.t === 'h') {
    b.disabled = false; b.textContent = '🏠 Rumah';
  } else if (n.i >= S.unlockedPlots) {
    b.disabled = false;
    b.textContent = n.i === S.unlockedPlots ? `Beli (${LAND_PRICES[n.i]})` : 'Beli Lahan';
  } else {
    const q = S.plots[n.i];
    b.disabled = !!q && epoch < q.e;
    b.textContent = !q ? '🌱 Tanam' : epoch >= q.e ? '🌾 Panen' : 'Tumbuh ' + fmt(q.e - epoch);
  }
}

function loop() {
  let dx = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0) + jv.x;
  let dy = (keys.ArrowDown || keys.s ? 1 : 0) - (keys.ArrowUp || keys.w ? 1 : 0) + jv.y;
  const m = Math.hypot(dx, dy);
  if (m > 1) { dx /= m; dy /= m; }

  if ($('panel').classList.contains('hidden') && !P.anim) {
    P.moving = m > 0.08;
    if (P.moving) {
      if (Math.abs(dx) > 0.05) P.dir = dx > 0 ? 1 : -1;
      P.walkCycle += m * 0.28;
    }
    P.x = Math.max(16, Math.min(384, P.x + dx * 3.2));
    const top = (P.x > 110 && P.x < 290) ? 162 : 105;
    P.y = Math.max(top, Math.min(575, P.y + dy * 3.2));
  } else {
    P.moving = false;
  }

  draw();
  requestAnimationFrame(loop);
}

addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys[k] = true;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
  if (k === 'e' || k === ' ' || k === 'Enter') act();
  if (k === 'Escape') closePanel();
});
addEventListener('keyup', e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
$('act').onclick = act;

const jz = $('joyZone'), kn = $('knob'); let jid = null;
function jmove(e) {
  const r = jz.getBoundingClientRect(), R = r.width / 2 - 10;
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2), d = Math.hypot(dx, dy);
  if (d > R) { dx *= R / d; dy *= R / d; }
  jv = { x: dx / R, y: dy / R }; kn.style.transform = `translate(${dx}px,${dy}px)`;
}
jz.addEventListener('pointerdown', e => { jid = e.pointerId; jz.setPointerCapture(jid); jmove(e); });
jz.addEventListener('pointermove', e => { if (e.pointerId === jid) jmove(e); });
const jend = e => { if (e.pointerId === jid) { jid = null; jv = { x: 0, y: 0 }; kn.style.transform = 'translate(0,0)'; } };
